{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* CONTENEDOR FLEX PARA DISTRIBUCIÓN VERTICAL AUTOMÁTICA */
    .auth-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 200px);
        padding: 40px 20px;
        box-sizing: border-box;
    }

    .auth-container { 
        width: 100%;
        max-width: 440px; 
    }
    
    /* TARJETA DE LOGIN */
    .auth-card { 
        background: white; 
        border-radius: 16px; 
        padding: 40px; 
        box-shadow: 0 10px 30px rgba(82,70,184,0.08); 
        border: 1px solid var(--p100); 
        position: relative; 
        overflow: hidden; 
    }
    .auth-card::before { 
        content: ''; 
        position: absolute; 
        top: 0; 
        left: 0; 
        right: 0; 
        height: 5px; 
        background: linear-gradient(135deg, var(--p900) 0%, var(--p700) 100%); 
    }
    
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h2 { font-family: 'Sora', sans-serif; font-size: 22px; color: var(--p900); margin: 0 0 8px 0; }
    .auth-header p { font-size: 13.5px; color: var(--text3); margin: 0; }

    /* CAMPOS DEL FORMULARIO */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--p200); border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box; }
    .form-input:focus { border-color: var(--p600); box-shadow: 0 0 0 3px rgba(82,70,184,0.1); }

    /* BOTÓN DE ACCESO */
    .btn-login { width: 100%; background: var(--p700); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 14.5px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-login:hover { background: var(--p800); }

    /* CAJA DE ERROR */
    .error-box { background: #ffebee; border: 1px solid #ef9a9a; color: #c62828; padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; font-weight: 500; }
    
    /* ENLACE DE RETORNO */
    .auth-footer { text-align: center; margin-top: 25px; }
    .auth-footer a { color: var(--p600); font-weight: 600; font-size: 13.5px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .auth-footer a:hover { color: var(--p800); }
</style>

<div class="auth-wrapper">
    <div class="auth-container">
        
        <div class="auth-card">
            
            <div class="auth-header">
                <h2>Acceso Institucional</h2>
                <p>Panel exclusivo para servidores públicos autorizados</p>
            </div>

            {% if error %}
                <div class="error-box">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login_funcionario' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="curp">CURP de Usuario</label>
                    <input type="text" id="curp" name="curp" class="form-input" placeholder="Ingrese su CURP" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login">
                    Iniciar Sesión en el Sistema
                </button>
            </form>

        </div>

        <div class="auth-footer">
            <a href="{% url 'inicio' %}">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Volver al portal ciudadano
            </a>
        </div>

    </div>
</div>
{% endblock content %}
