{% extends 'base.html' %}

{% block content %}
<div class="wave-auth-bg">
  <div class="auth-box" style="max-width: 480px; padding: 40px; background: var(--white); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center;">
    
    <div style="width: 60px; height: 60px; background: #fee2e2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <svg viewBox="0 0 24 24" width="30" height="30" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
    </div>
    
    <h2 style="font-size: 22px; color: var(--text); margin-bottom: 12px;">Enlace Inválido</h2>
    <p style="color: var(--p600); font-size: 14.5px; line-height: 1.6;">
      El enlace de activación es inválido o ya ha expirado. Por tu seguridad, los enlaces de un solo uso tienen un tiempo de validez limitado.
    </p>
    
    <div style="margin-top: 24px;">
      <a href="{% url 'registro' %}" class="btn-solid" style="display: block; padding: 14px; text-decoration: none;">Volver al registro</a>
    </div>
    
  </div>
</div>
{% endblock content %}
