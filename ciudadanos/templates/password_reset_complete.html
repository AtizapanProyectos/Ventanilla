{% extends 'base.html' %}

{% block content %}
<div class="wave-auth-bg">
  <div class="auth-box" style="max-width: 480px; padding: 40px; background: var(--white); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center;">
    
    <div style="width: 60px; height: 60px; background: var(--teal-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <svg viewBox="0 0 24 24" width="30" height="30" stroke="var(--teal)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </div>
    
    <h2 style="font-size: 22px; color: var(--text); margin-bottom: 12px;">¡Contraseña actualizada!</h2>
    <p style="color: var(--p600); font-size: 14.5px; line-height: 1.6;">
      Tu contraseña ha sido restablecida con éxito. Ya puedes acceder al Portal de Trámites Municipales utilizando tu nueva clave.
    </p>
    
    <div style="margin-top: 24px;">
      <button class="btn-solid" id="btn-login-trigger" style="width: 100%; padding: 14px;">
        Ir a Iniciar Sesión
      </button>
    </div>
    
  </div>
</div>

<!-- Script para que este botón abra tu menú desplegable superior -->
<script>
  document.getElementById('btn-login-trigger').addEventListener('click', function(e) {
    e.stopPropagation();
    const dropdown = document.getElementById('login-dropdown');
    if (dropdown) {
      dropdown.classList.add('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
</script>
{% endblock content %}
