{% extends 'base.html' %}

{% block content %}
<div class="wave-auth-bg">
  <div class="auth-box" style="max-width: 480px; padding: 40px; background: var(--white); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    
    <div class="auth-header" style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 22px; color: var(--text);">Recuperar Contraseña</h2>
      <p style="color: var(--p600); font-size: 14.5px; margin-top: 8px; line-height: 1.5;">
        Ingresa el correo electrónico asociado a tu cuenta ciudadana. Te enviaremos un enlace seguro para restablecer tu acceso.
      </p>
    </div>
    
    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="input-group">
        <label>Correo electrónico oficial</label>
        <input type="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email" style="width: 100%;">
      </div>
      
      <button type="submit" class="btn-solid" style="width: 100%; margin-top: 8px; padding: 14px; font-size: 15px;">
        Enviar enlace de recuperación
      </button>
    </form>
    
    <div class="auth-footer" style="text-align: center; margin-top: 24px;">
      <a href="{% url 'inicio' %}" style="color: var(--teal); font-weight: 600; font-size: 14px;">Volver al inicio</a>
    </div>
    
  </div>
</div>
{% endblock content %}
