{% extends 'base.html' %}

{% block content %}
<div class="wave-auth-bg">
  <div class="auth-box" style="max-width: 480px; padding: 40px; background: var(--white); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center;">
    
    <div style="width: 60px; height: 60px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <svg viewBox="0 0 24 24" width="30" height="30" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </div>
    
    <h2 style="font-size: 22px; color: var(--text); margin-bottom: 12px;">¡Cuenta Activada!</h2>
    <p style="color: var(--p600); font-size: 14.5px; line-height: 1.6;">
      Tu correo electrónico ha sido validado exitosamente. Tu cuenta ciudadana ya está completamente activa y tu sesión ha sido iniciada.
    </p>
    
    <div style="margin-top: 24px;">
      <a href="{% url 'inicio' %}" class="btn-solid" style="display: block; padding: 14px; text-decoration: none; background: #16a34a; border-color: #16a34a;">Continuar al portal</a>
    </div>
    
  </div>
</div>
{% endblock content %}
